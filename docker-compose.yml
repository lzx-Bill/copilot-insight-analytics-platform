services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: ciap-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USERNAME:-ciap_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-change_me}
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME:-copilot_insight}
    networks:
      - ciap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ciap-redis
    ports:
      - "${REDIS_PORT:-6847}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me}
    networks:
      - ciap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch (可选，Phase 2 使用)
  # elasticsearch:
  #   image: elasticsearch:8.11.0
  #   container_name: ciap-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - es_data:/usr/share/elasticsearch/data
  #   networks:
  #     - ciap-network
  #   restart: unless-stopped

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciap-backend
    ports:
      - "${BACKEND_PORT:-8847}:8847"
    environment:
      - MONGODB_URL=mongodb://${MONGODB_ROOT_USERNAME:-ciap_admin}:${MONGODB_ROOT_PASSWORD:-change_me}@mongodb:27017/?authSource=admin
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-copilot_insight}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0
      - BACKEND_PORT=${BACKEND_PORT:-8847}
      - BACKEND_CORS_ORIGINS=["http://localhost:${FRONTEND_PORT:-5173}","http://localhost:5174","http://127.0.0.1:${FRONTEND_PORT:-5173}"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - ciap-network
    restart: unless-stopped

  # React 前端 (开发模式)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ciap-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-8847}/api/v1
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ciap-network
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
  redis_data:
  # es_data:
  backend_logs:

networks:
  ciap-network:
    driver: bridge
